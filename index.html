<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Ginjoplayer | Music Room</title>
    <style>
        :root { --ink: #dbe6df; --muted: #93a49a; --paper: #0d1715; --card: #13231f; --accent: #b99343; --accent-bright: #d6b765; --line: #2f5148; --custom-image: none; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "Avenir Next", "Hiragino Kaku Gothic ProN", sans-serif; background: radial-gradient(circle at 75% 0%, #1e3a32 0, transparent 34%), var(--paper); }
        body::before { content: "🍸   ✦"; position: fixed; top: 18px; right: 5vw; z-index: -1; color: rgba(214,183,101,.14); font-size: 90px; letter-spacing: 20px; pointer-events: none; }
        .page-shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 60px; }
        .masthead { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 8px 0 30px; border-bottom: 1px solid var(--line); }
        .language-switcher { position: absolute; top: -8px; right: 0; display: flex; gap: 4px; }
        .language-button { width: 38px; height: 32px; padding: 0; color: var(--muted); border: 1px solid var(--accent); border-radius: 2px; background: transparent; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; }
        .language-button.is-active, .language-button:hover { color: var(--paper); background: var(--accent); }
        .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
        h1 { margin: 0; color: #edf3ee; font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 5vw, 62px); font-weight: 400; letter-spacing: -.04em; line-height: calc(.95em + 3px); text-shadow: 0 2px 20px rgba(0,0,0,.4); }
        .brand-note { width: 280px; max-width: 100%; height: 88px; margin: 0; color: var(--muted); display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; font-size: 13px; line-height: 1.7; text-align: right; }
        .player-card { overflow: hidden; padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(145deg, rgba(24,48,41,.96), rgba(10,22,19,.96)); box-shadow: 0 18px 45px rgba(0,0,0,.28), inset 0 1px rgba(214,183,101,.18); }
        .art-strip { min-height: 104px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; color: white; background: linear-gradient(105deg, rgba(9,24,20,.96), rgba(42,73,59,.9)), var(--custom-image); background-size: cover; background-position: center; border: 1px solid rgba(214,183,101,.3); border-radius: 11px; }
        .art-strip strong { display: block; margin: 3px 0 5px; overflow: hidden; font-family: Georgia, "Times New Roman", serif; font-size: 29px; font-weight: 400; text-overflow: ellipsis; white-space: nowrap; }
        .art-strip small { color: rgba(255,255,255,.7); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
        .art-strip .singer, .art-strip .original { display: block; color: rgba(255,255,255,.72); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
        .art-strip .original { margin-top: 3px; }
        .player-frame { width: min(100%, 720px); aspect-ratio: 16 / 9; margin: 22px auto 0; overflow: hidden; background: #111820; border-radius: 10px; }
        #player, #player iframe { display: block; width: 100%; height: 100%; }
        .player-controls { display: flex; justify-content: center; gap: 9px; margin-top: 17px; align-items: center; flex-wrap: wrap; }
        .player-controls button { width: 48px; height: 42px; padding: 0; color: var(--ink); border: 1px solid var(--line); border-radius: 99px; background: rgba(7,18,15,.55); cursor: pointer; font: inherit; transition: .2s ease; }
        .player-controls .custom-icon { display: block; width: 22px; height: 22px; margin: auto; }
        .player-controls .control-icon { display: inline-block; font-size: 20px; line-height: 1; }
        .player-controls #playButton { width: 58px; color: #101b17; border-color: var(--accent-bright); background: var(--accent-bright); }
        .player-controls #playButton:hover { color: white; border-color: var(--ink); background: var(--ink); }
        .player-controls button:hover { color: white; border-color: var(--accent); background: var(--accent); }
        #playerMessage { min-height: 20px; margin: 10px 0 0; color: #b23d32; font-size: 13px; text-align: center; }
        .library-heading { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin: 54px 0 18px; }
        .library-heading h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 31px; font-weight: 400; }
        .library-heading p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.45; letter-spacing: .02em; text-align: justify; text-align-last: justify; }
        .library-heading p span { display: block; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        input, select { min-height: 42px; padding: 8px 12px; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; background: rgba(17,38,32,.9); font: inherit; }
        .favorites-toggle { min-height: 42px; padding: 8px 14px; color: var(--accent-bright); border: 1px solid var(--accent); border-radius: 7px; background: transparent; cursor: pointer; font: inherit; }
        .favorites-toggle.is-active { color: #17211d; background: var(--accent-bright); }
        #searchInput { flex: 1 1 240px; }
        .song-list { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
        .song-item { padding: 12px; border: 1px solid transparent; border-radius: 10px; background: rgba(19,35,31,.76); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: .2s ease; }
        .song-item:hover { border-color: var(--accent); background: #1a332b; transform: translateY(-1px); }
        .song-item.is-playing { border-color: var(--accent-bright); background: linear-gradient(90deg, rgba(91,111,55,.42), rgba(31,65,51,.95)); box-shadow: inset 4px 0 var(--accent-bright); }
        .song-main { display: flex; align-items: center; min-width: 0; }
        .song-title { font-weight: bold; }
        .song-meta { color: var(--muted); font-size: 12px; }
        .badge { padding: 4px 8px; color: var(--accent-bright); border: 1px solid var(--accent); border-radius: 99px; font-size: 11px; white-space: nowrap; }
        .song-thumbnail { width: 88px; height: 56px; object-fit: cover; margin-right: 12px; border-radius: 6px; flex-shrink: 0; }
        .song-details { min-width: 0; }
        .song-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .favorite-button { width: 32px; height: 32px; padding: 0; color: var(--accent-bright); border: 1px solid var(--line); border-radius: 50%; background: transparent; cursor: pointer; font-size: 19px; line-height: 1; }
        .favorite-button.is-favorite { color: #ef5350; border-color: #ef5350; }
        .video-link { color: var(--accent); font-size: 12px; white-space: nowrap; }
        /* 针对手机移动端的优化排版 */
@media (max-width: 640px) {
  /* 1. 外层容器与边距调整 */
  .page-shell {
    width: calc(100% - 24px);
    padding: 16px 0 40px;
  }
@media (max-width: 640px) {
  /* 1. 调整背景 🍸 ✦ 图标在手机端的大小和透明度 */
  body::before {
    font-size: 48px;            /* 手机端缩小图标尺寸，防止过于抢眼或撑开页面 */
    top: 12px;                  /* 距顶部位置微调 */
    right: 4vw;                 /* 距右侧位置微调 */
    letter-spacing: 10px;       /* 缩小字间距 */
    color: rgba(214,183,101,0.18); /* 保留半透明效果（0.18 约等于 18% 不透明度） */
  }
}
  /* 2. 标头布局与字体微调 */
  .masthead {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    padding-bottom: 20px;
  }

  h1 {
    font-size: 32px; /* 缩小大标题防换行挤压 */
  }

  .brand-note {
    width: 100%;
    height: auto;
    align-items: flex-start;
    text-align: left;
    font-size: 12px;
  }

  .language-switcher {
    top: 0;
    right: 0;
  }

  /* 3. 播放卡片与控制条优化 */
  .player-card {
    padding: 14px;
    border-radius: 14px;
  }

  .art-strip {
    padding: 12px;
    min-height: 80px;
  }

  .art-strip strong {
    font-size: 20px; /* 播放中的歌名缩小 */
  }

  .player-frame {
    margin-top: 14px;
    border-radius: 8px;
  }

  /* 控制按钮：放大触摸面积，防止手误 */
  .player-controls {
    gap: 12px;
    margin-top: 14px;
  }

  .player-controls button {
    width: 44px;
    height: 44px;
  }

  .player-controls #playButton {
    width: 54px;
  }

  /* 4. 曲库标题与搜索/筛选控制区 */
  .controls {
    flex-direction: column; 
    align-items: stretch;
    gap: 8px;
  }

  /* 强制锁定搜索框与下拉框的大小和内边距 */
  #searchInput, #categorySelect, #subCategorySelect, .favorites-toggle {
    -webkit-appearance: none; /* 清除 iOS/Safari 默认的输入框臃肿外观 */
    appearance: none;
    width: 100%;
    
    /* 锁定高度与行高 */
    height: 36px !important;     /* 如果觉得 42px 还是太高，这里可以直接改成 36px 或 32px */
    min-height: 36px !important;
    max-height: 36px !important;
    line-height: 36px;
    
    /* 压缩内部上下间距，防止内边距把框撑大 */
    padding: 0 12px !important;
    font-size: 14px;
    box-sizing: border-box;
  }

  /* 5. 曲目列表项移动端排版与字体放大 */
  .song-item {
    flex-direction: column; 
    align-items: stretch;
    gap: 12px;
    padding: 12px;
  }

  .song-main {
    width: 100%;
  }

  .song-thumbnail {
    width: 80px;       /* 稍微调大一点缩略图，匹配放大后的字体 */
    height: 52px;
    margin-right: 12px;
  }

  /* 歌曲标题字体放大 */
  .song-title {
    font-size: 16px;   /* 从 14px 放大到 16px */
    line-height: 1.3;
  }

  /* 歌手/原唱元信息字体放大 */
  .song-meta {
    font-size: 13px;   /* 从 11px 放大到 13px */
    margin-top: 2px;
  }

  /* 底部动作区域 */
  .song-actions {
    width: 100%;
    margin-left: 0;
    justify-content: space-between; 
    border-top: 1px dashed rgba(255, 255, 255, 0.1);
    padding-top: 10px;
  }

  /* 标签字体放大 */
  .badge {
    font-size: 12px;   /* 从 10px 放大到 12px */
    padding: 3px 8px;
  }

  /* 原视频链接字体放大 */
  .video-link {
    font-size: 13px;   /* 从 12px 放大到 13px */
  }
}

      // 3. YouTube APIの準備
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var player;
      var playerReady = false;
      var pendingSong = null;
      var selectedSong = null;
      var playbackTimer;
      var favoritesOnly = false;
      var favoriteKeys = new Set(JSON.parse(localStorage.getItem('ginjoplayer-favorites') || '[]'));
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '100%',
          width: '100%',
          playerVars: { rel: 0 },
          events: { onReady: onPlayerReady, onError: showPlayerError }
        });
      }

      function onPlayerReady() {
        playerReady = true;
      }

      // 4. 曲再生の処理
      function getStartTime(song) {
        return Number.isFinite(song.startTime) ? song.startTime : 0;
      }

      function getEndTime(song) {
        return Number.isFinite(song.endTime) ? song.endTime : null;
      }

      function updateNowPlaying(song) {
        document.getElementById('currentTitle').textContent = song.title;
        document.getElementById('currentSinger').textContent = `${t('coverLabel')} · ${song.singer}`;
        document.getElementById('currentOriginal').textContent = `${t('originalLabel')} · ${song.originalArtist}`;
      }

      function songKey(song) {
        return [song.id, song.startTime || 0, song.endTime || '', song.title].join('|');
      }

      function saveFavorites() {
        localStorage.setItem('ginjoplayer-favorites', JSON.stringify([...favoriteKeys]));
      }

      function toggleFavorite(song) {
        const key = songKey(song);
        if (favoriteKeys.has(key)) {
          favoriteKeys.delete(key);
        } else {
          favoriteKeys.add(key);
        }
        saveFavorites();
        renderCurrentSongs();
      }

      function updateFavoritesButton() {
        const button = document.getElementById('favoritesToggle');
        button.textContent = `${favoritesOnly ? '♥' : '♡'} ${t('favorites')}`;
      }

      function playSong(song) {
        selectedSong = song;
        pendingSong = song;
        updateNowPlaying(song);
        renderCurrentSongs();
        document.getElementById('playerMessage').textContent = '';
        if (!/^[A-Za-z0-9_-]{11}$/.test(song.id)) {
          document.getElementById('playerMessage').textContent = t('invalidId');
          return;
        }
        if (!playerReady || !player || !player.loadVideoById) {
          document.getElementById('playerMessage').textContent = t('loading');
          return;
        }
        loadSong(song, true);
      }

      function loadSong(song, shouldPlay = false) {
        const startTime = getStartTime(song);
        const endTime = getEndTime(song);
        clearInterval(playbackTimer);
        const videoOptions = { videoId: song.id, startSeconds: startTime };
        if (endTime !== null) videoOptions.endSeconds = endTime;
        player.loadVideoById(videoOptions);
        if (shouldPlay && player.playVideo) {
          player.playVideo();
          setPlaybackButton(true);
        }
        document.getElementById('playerMessage').textContent = '';
        startPlaybackTimer();
      }

         function startPlaybackTimer() {
         clearInterval(playbackTimer);
         playbackTimer = setInterval(() => {
          const endTime = getEndTime(selectedSong);
          if (player && player.getCurrentTime && endTime !== null &&
              player.getCurrentTime() >= endTime) {
            pauseSong();
          }
        }, 250);
      }

      function resumeSong() {
        if (!selectedSong) {
          document.getElementById('playerMessage').textContent = t('chooseFirst');
          return;
        }
        if (!playerReady || !player || !player.playVideo) {
          pendingSong = selectedSong;
          document.getElementById('playerMessage').textContent = t('loading');
          return;
        }
        if (player && player.playVideo) {
          const startTime = getStartTime(selectedSong);
          const endTime = getEndTime(selectedSong);
          const currentTime = player.getCurrentTime ? player.getCurrentTime() : startTime;
          if (endTime !== null && currentTime >= endTime) {
            const videoOptions = { videoId: selectedSong.id, startSeconds: startTime, endSeconds: endTime };
            player.loadVideoById(videoOptions);
          } else {
            player.playVideo();
          }
          setPlaybackButton(true);
          startPlaybackTimer();
        }
      }

      function setPlaybackButton(isPlaying) {
        const button = document.getElementById('stopButton');
        button.setAttribute('aria-label', isPlaying ? t('pause') : t('play'));
        button.setAttribute('title', isPlaying ? t('pause') : t('play'));
        button.dataset.playing = String(isPlaying);
      }

      function updatePauseButton() {
        const isPlaying = Boolean(player && typeof player.getPlayerState === 'function' && window.YT && YT.PlayerState && player.getPlayerState() === YT.PlayerState.PLAYING);
        setPlaybackButton(isPlaying);
      }

      function pauseSong() {
        clearInterval(playbackTimer);
        if (player && player.pauseVideo) {
          player.pauseVideo();
          setPlaybackButton(false);
        }
      }

      function seekSong(seconds) {
        if (!player || !player.getCurrentTime || !player.seekTo || !selectedSong) {
          return;
        }
        const currentTime = player.getCurrentTime();
        const startTime = getStartTime(selectedSong);
        const endTime = getEndTime(selectedSong);
        const requestedTime = currentTime + seconds;
        const targetTime = endTime === null
          ? Math.max(startTime, requestedTime)
          : Math.max(startTime, Math.min(endTime, requestedTime));
        player.seekTo(targetTime, true);
      }

      function showPlayerError(event) {
        const messages = {
          2: t('invalidId'),
          5: t('htmlError'),
          100: t('deleted'),
          101: t('embedError'),
          150: t('embedError'),
          153: t('fileError')
        };
        document.getElementById('playerMessage').textContent = messages[event.data] || t('playerError');
      }

      // 5. 画面に曲一覧を表示する処理
      function renderSongs(songArray) {
        const listElement = document.getElementById('songList');
        listElement.innerHTML = ''; // 一旦クリア

        songArray.forEach(song => {
          const item = document.createElement('div');
          item.className = 'song-item';
          if (selectedSong && songKey(selectedSong) === songKey(song)) {
            item.classList.add('is-playing');
          }
          const isFavorite = favoriteKeys.has(songKey(song));
          const thumbnailUrl = 'https://img.youtube.com/vi/' + song.id + '/mqdefault.jpg';
          const videoUrl = 'https://www.youtube.com/watch?v=' + song.id;
          item.innerHTML = `
            <div class="song-main">
              <img class="song-thumbnail" src="${thumbnailUrl}" alt="${song.title}" loading="lazy">
              <div class="song-details">
                <div class="song-title">${song.title}</div>
                <div class="song-meta">${t('originalMeta')}: ${song.originalArtist}</div>
                <div class="song-meta">${t('coverMeta')}: ${song.singer}</div>
              </div>
            </div>
            <div class="song-actions">
              <span class="badge">${localizedCategory(song.category)}</span>
              <span class="badge">${localizedSubCategory(song.subCategory)}</span>
              <button class="favorite-button${isFavorite ? ' is-favorite' : ''}" type="button" aria-label="${isFavorite ? t('removeFavorite') : t('addFavorite')}" title="${isFavorite ? t('removeFavorite') : t('addFavorite')}">${isFavorite ? '♥' : '♡'}</button>
              <a class="video-link" href="${videoUrl}" target="_blank" rel="noopener" aria-label="${song.title} ${t('openVideo')}">${t('openVideo')}</a>
            </div>
          `;
          item.onclick = () => playSong(song);
          item.querySelector('.video-link').onclick = event => event.stopPropagation();
          item.querySelector('.favorite-button').onclick = event => {
            event.stopPropagation();
            toggleFavorite(song);
          };
          listElement.appendChild(item);
        });
      }

      function renderCurrentSongs() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const selectedCat = document.getElementById('categorySelect').value;
        const selectedSubCat = document.getElementById('subCategorySelect').value;
        const filtered = songs.filter(song => {
          const matchesSearch = song.title.toLowerCase().includes(searchText) || song.originalArtist.toLowerCase().includes(searchText) || song.singer.toLowerCase().includes(searchText);
          const matchesCat = selectedCat === 'ALL' || song.category === selectedCat;
          const matchesSubCat = selectedSubCat === 'ALL' || song.subCategory === selectedSubCat;
          const matchesFavorite = !favoritesOnly || favoriteKeys.has(songKey(song));
          return matchesSearch && matchesCat && matchesSubCat && matchesFavorite;
        });
        filtered.sort((firstSong, secondSong) => firstSong.title.localeCompare(secondSong.title, 'ja', { sensitivity: 'base' }));
        renderSongs(filtered);
      }

      // 6. 検索・絞り込み処理
      function filterSongs() {
        renderCurrentSongs();
      }

      // 7. 大区分が変わった時に小区分を書き換える処理
      document.getElementById('categorySelect').addEventListener('change', function() {
        const selectedCategory = this.value;

        if (subCategories[selectedCategory]) {
          subCategories[selectedCategory].forEach(sub => {
            const option = document.createElement('option');
            option.value = sub;
            option.textContent = localizedSubCategory(sub);
            subSelect.appendChild(option);
          });

          [...new Set(Object.values(subCategories).flat())].forEach(sub => {
            const option = document.createElement('option');
            option.value = sub;
            option.textContent = localizedSubCategory(sub);
            subSelect.appendChild(option);
          });
        }

        filterSongs();
      });

      function populateSubCategories() {
        const subSelect = document.getElementById('subCategorySelect');

      function localizedSubCategory(subCategory) {
        const labels = {
          'J-POP': { zh: 'J-Pop', en: 'J-Pop' },
          'アニメソング': { zh: '动漫歌曲', en: 'Anime Song' },
          'ボカロ': { zh: 'Vocaloid', en: 'Vocaloid' },
          'VOCALOID': { zh: 'Vocaloid', en: 'Vocaloid' },
          'ORIGINAL': { zh: '原创', en: 'Original' },
          'POP': { zh: '流行', en: 'Pop' }
        };
        return currentLanguage === 'ja' ? subCategory : (labels[subCategory]?.[currentLanguage] || subCategory);
      }

      function localizedCategory(category) {
        if (currentLanguage === 'ja') return category;
        return category === '邦楽' ? (currentLanguage === 'zh' ? '日文曲' : 'Japanese Song') : (currentLanguage === 'zh' ? '英文曲' : 'English Song');
      }

      populateSubCategories();
      renderCurrentSongs();
      applyLanguage('ja');
    </script>
</body>
